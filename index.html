  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #6e451f; }

    /* Animated "cleaning bubbles" backdrop shown around the portrait game. */
    #backdrop { position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(135deg, #8a5a2b, #a8713a, #c08a4e, #96622f, #8a5a2b);
      background-size: 300% 300%; animation: flow 40s ease-in-out infinite; }
    #backdrop::after { content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.06) 0%, rgba(45,22,4,.62) 100%); }
    .bubble { position: absolute; bottom: -140px; border-radius: 50%; z-index: 1;
      border: 1px solid rgba(255,255,255,.22); filter: blur(1.5px);
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.35) 0 6%, rgba(255,255,255,.08) 14%, rgba(255,255,255,.01) 55%, rgba(255,236,205,.12) 100%);
      animation: rise linear infinite; }
    @keyframes flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes rise {
      0% { transform: translate(0, 0) scale(.85); opacity: 0; }
      10% { opacity: .6; }
      50% { transform: translate(var(--sway), -60vh) scale(1); }
      90% { opacity: .5; }
      100% { transform: translate(0, calc(-100vh - 280px)) scale(1.08); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { #backdrop, .bubble { animation-play-state: paused; } }
    #unity-canvas { position: fixed; left: 0; top: 0; background: #000; touch-action: none; outline: none; box-shadow: 0 0 60px 18px rgba(0,0,0,.55); }
    /* Loading screen: covers the 9:16 game area until the game is ready. */
    #loading-screen { position: fixed; left: 0; top: 0; height: 100%; overflow: hidden; z-index: 2;
      background: radial-gradient(circle at 50% 38%, #8a5a2b 0%, #4a2b12 45%, #1e1007 100%);
      transition: opacity .6s ease; }
    #loading-screen.done { opacity: 0; pointer-events: none; }
    #rays { position: absolute; left: 50%; top: 38%; width: 260vh; height: 260vh; margin: -130vh 0 0 -130vh; border-radius: 50%;
      background: repeating-conic-gradient(rgba(255,214,150,.09) 0 9deg, transparent 9deg 22deg);
      -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 34%); mask-image: radial-gradient(circle, #000 0%, transparent 34%);
      animation: spin 40s linear infinite; }
    .load-bubble { position: absolute; bottom: -60px; border-radius: 50%; border: 1px solid rgba(255,255,255,.45);
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.85) 0 7%, rgba(255,255,255,.15) 16%, rgba(255,236,205,.04) 55%, rgba(255,236,205,.25) 100%);
      animation: load-rise linear infinite; }
    .twinkle { position: absolute; background: #fff6d8; opacity: 0;
      clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
      animation: twinkle 2.4s ease-in-out infinite; }
    /* Logo above the middle of the screen, sized to the 9:16 game area. */
    #logo-wrap { position: absolute; left: 11%; right: 11%; top: 38%; transform: translateY(-50%); }
    #loading-logo { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
      animation: pop .8s cubic-bezier(.2,1.6,.4,1) both, float 3.2s ease-in-out .8s infinite; }
    #loading { position: absolute; left: 14%; right: 14%; top: 70%; height: 20px; padding: 3px; border-radius: 13px;
      background: rgba(0,0,0,.45); border: 2px solid rgba(255,233,200,.85); box-shadow: 0 0 16px rgba(235,173,100,.45); }
    #loading-track { position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; }
    #loading-fill { position: relative; width: 0; min-width: 20px; height: 100%; border-radius: 10px; overflow: hidden;
      background: linear-gradient(180deg, #ffe08a 0%, #ffb03a 50%, #f08019 100%);
      transition: width .35s ease-out; animation: glow 1.4s ease-in-out infinite; }
    /* Moving stripes and a shine keep the bar alive even while progress pauses. */
    #loading-fill::before { content: ""; position: absolute; top: 0; bottom: 0; left: -40px; right: 0;
      background: repeating-linear-gradient(115deg, rgba(255,255,255,.28) 0 8px, transparent 8px 20px);
      background-size: 22.07px 100%; animation: stripes .6s linear infinite; }
    #loading-fill::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -60px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); animation: shine 1.5s ease-in-out infinite; }
    #loading-text { position: absolute; left: 0; right: 0; top: calc(70% + 34px); text-align: center;
      font: bold 17px "Trebuchet MS", Verdana, sans-serif; letter-spacing: 1px; color: #ffe9c8; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes load-rise { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .8; } 50% { transform: translate(14px, -55vh); }
      85% { opacity: .6; } 100% { transform: translate(-6px, calc(-100vh - 120px)); opacity: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(90deg); } }
    @keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 50% { transform: translateY(-12px) scale(1.04) rotate(-1deg); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 5px #ffb03a; } 50% { box-shadow: 0 0 14px #ffd36b; } }
    @keyframes stripes { to { transform: translateX(22.07px); } }
    @keyframes shine { to { left: 100%; } }
  </style>

  <script>
    var canvas = document.getElementById("unity-canvas");
    var loadingScreen = document.getElementById("loading-screen");
    var loadingText = document.getElementById("loading-text");
    var fill = document.getElementById("loading-fill");

    var backdrop = document.getElementById("backdrop");

    // Keep the game in a centered 9:16 portrait area; the page color fills the rest.
    var ASPECT = 9 / 16;
    function fitCanvas() {
      var w = window.innerWidth, h = window.innerHeight;
      // Screens narrower than 9:16 (tall phones) use the full window.
      var width = w / h > ASPECT ? Math.floor(h * ASPECT) : w;
      canvas.style.width = width + "px";
      canvas.style.height = h + "px";
      // Whole pixels only: a half-pixel offset (e.g. translate(-50%)) blurs the whole game.
      canvas.style.left = Math.floor((w - width) / 2) + "px";
      loadingScreen.style.left = canvas.style.left;
      loadingScreen.style.width = canvas.style.width;
      // Nothing to see when the game fills the window, so don't spend GPU time on it.
      backdrop.style.display = width < w ? "" : "none";
    }
    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    var buildUrl = "Build";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/a4a2dc2ab1b046fd76c90504e44b8f36.data.unityweb",

      // Hashed file names (Name Files As Hashes) change with their content, so a cached copy never
      // goes stale. Any other name is checked with the server, so players can't get stuck on an old build.
      cacheControl: function (url) {
        return /\/[0-9a-f]{32}\./.test(url) ? "immutable" : "must-revalidate";
      },
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Apex Theory Game",
      productName: "Perfect MakeOver Cleaning ASMR",
      productVersion: "1.0.1",
    };

    var script = document.createElement("script");
    script.src = buildUrl + "/86e185b1716eef03e3cddc99eba0fc37.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
        loadingText.textContent = "LOADING " + Math.round(100 * progress) + "%";

        setTimeout(function () { loadingScreen.style.display = "none"; }, 700);
