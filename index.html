  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #6e451f; }

    /* Animated "cleaning bubbles" backdrop shown around the portrait game. */
    #backdrop { position: fixed; inset: 0; overflow: hidden; pointer-events: none;
      background: linear-gradient(135deg, #8a5a2b, #a8713a, #c08a4e, #96622f, #8a5a2b);
      background-size: 300% 300%; animation: flow 40s ease-in-out infinite; }
    #backdrop::after { content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.06) 0%, rgba(45,22,4,.62) 100%); }
    .bubble { position: absolute; bottom: -140px; border-radius: 50%; z-index: 1;
      border: 1px solid rgba(255,255,255,.22); filter: blur(1.5px);
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.35) 0 6%, rgba(255,255,255,.08) 14%, rgba(255,255,255,.01) 55%, rgba(255,236,205,.12) 100%);
      animation: rise linear infinite; }
    @keyframes flow { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes rise {
      0% { transform: translate(0, 0) scale(.85); opacity: 0; }
      10% { opacity: .6; }
      50% { transform: translate(var(--sway), -60vh) scale(1); }
      90% { opacity: .5; }
      100% { transform: translate(0, calc(-100vh - 280px)) scale(1.08); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { #backdrop, .bubble { animation-play-state: paused; } }
